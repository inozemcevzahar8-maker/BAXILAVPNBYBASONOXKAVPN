<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Авторизация</title><style>body{font-family:-apple-system,system-ui,sans-serif;background-color:#f5f5f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.05);text-align:center;max-width:320px;width:100%;position:relative}.session-id{position:absolute;top:15px;right:20px;font-size:11px;color:#b0b0b5;font-weight:500}h2{margin-bottom:20px;color:#1d1d1f;font-size:22px;margin-top:10px}input{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:8px;font-size:16px;box-sizing:border-box;text-align:center;margin-bottom:15px;outline:none}input:focus{border-color:#0071e3}button{width:100%;padding:12px;background-color:#0071e3;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}#error{color:#ff3b30;font-size:13px;margin-top:10px;display:none}#success{color:#34c759;font-size:16px;font-weight:600;margin-top:10px;display:none}</style></head><body><div class="card"><div class="session-id" id="sessionDisplay">ID: #0</div><h2>Авторизация Wi-Fi</h2><div id="form-block"><input type="number" id="code" placeholder="Введите код" autofocus><button onclick="checkCode()">Подключиться</button></div><div id="error">Неверный код доступа. Попробуйте снова.</div><div id="success">Готово, интернет есть!</div></div><script>var validCodes=["1240","1155","9952","8888","8080","3344","5566","7711","4545","9090","2323","7410","8520","9630","1590","3570","4812","5050","7070","1111"];var currentMinute=new Date().getMinutes();var codeIndex=Math.floor(currentMinute/3)%20;var sessionNum=codeIndex+1;document.getElementById("sessionDisplay").innerText="ID: #"+sessionNum;function checkCode(){var e=document.getElementById("code").value,t=document.getElementById("error"),n=document.getElementById("success"),s=document.getElementById("form-block");e===validCodes[codeIndex]?(t.style.display="none",s.style.display="none",n.style.display="block",setTimeout(function(){window.location.href="http://logout"},2000)):(t.style.display="block",document.getElementById("code").value="")}</script></body></html>
